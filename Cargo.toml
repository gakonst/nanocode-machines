[package]
name = "nanocode-machines"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Machine Payments Protocol transports for Nanocode agents"
repository = "https://github.com/gakonst/nanocode-machines"
publish = false

[dependencies]
nanocode = { git = "https://github.com/gakonst/nanocode", rev = "aa8aeb45fbead2847d373b1fb1575eb686d3baf0" }
nanocode-cli = { git = "https://github.com/gakonst/nanocode", rev = "aa8aeb45fbead2847d373b1fb1575eb686d3baf0" }
mpp = { git = "https://github.com/tempoxyz/mpp-rs", rev = "f83589586dae0a225088818eafe40d8043dd368b", default-features = false, features = ["client", "tempo", "sqlite", "reqwest-rustls-tls-no-provider"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
http = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
