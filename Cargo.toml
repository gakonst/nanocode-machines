[package]
name = "nanocode-machines"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "The Nanocode CLI paid over Machine Payments Protocol sessions"
repository = "https://github.com/gakonst/nanocode-machines"
publish = false

[dependencies]
async-trait = "0.1.89"
nanocode = { git = "https://github.com/gakonst/nanocode", rev = "e8c9c572dff51c69befada2374e960302003e922" }
nanocode-cli = { git = "https://github.com/gakonst/nanocode", rev = "e8c9c572dff51c69befada2374e960302003e922" }
mpp = { git = "https://github.com/tempoxyz/mpp-rs", rev = "269b9308aba280b2975bb6eb5f8f498fd9d540d9", default-features = false, features = ["client", "tempo", "sqlite", "forward-proxy", "reqwest-rustls-tls-no-provider"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
http = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }
serde_json = "1.0.149"
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
