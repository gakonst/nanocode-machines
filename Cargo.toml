[package]
name = "nanocode-machines"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "The Nanocode CLI paid over Machine Payments Protocol sessions"
repository = "https://github.com/gakonst/nanocode-machines"
publish = false

[dependencies]
nanocode = { git = "https://github.com/gakonst/nanocode", rev = "35cdad347e10847c39c42c1c4f3bcc00b1f2fc04" }
nanocode-cli = { git = "https://github.com/gakonst/nanocode", rev = "35cdad347e10847c39c42c1c4f3bcc00b1f2fc04" }
mpp = { git = "https://github.com/tempoxyz/mpp-rs", rev = "566c707567a56416e2e30bab65d250750e28f316", default-features = false, features = ["client", "tempo", "sqlite", "forward-proxy", "reqwest-rustls-tls-no-provider"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
http = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }
serde_json = "1.0.149"
