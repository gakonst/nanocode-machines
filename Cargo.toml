[package]
name = "nanocode-machines"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "The Nanocode CLI paid over Machine Payments Protocol sessions"
repository = "https://github.com/gakonst/nanocode-machines"
publish = false

[dependencies]
nanocode = { git = "https://github.com/gakonst/nanocode", rev = "15ca3a62933b39d0c2ac58dbd7afb50e69ebbda2" }
nanocode-cli = { git = "https://github.com/gakonst/nanocode", rev = "15ca3a62933b39d0c2ac58dbd7afb50e69ebbda2" }
mpp = { git = "https://github.com/tempoxyz/mpp-rs", rev = "c72ff3ae12e32abf58129d9f7c7cc0e7e7b0a137", default-features = false, features = ["client", "tempo", "sqlite", "forward-proxy", "reqwest-rustls-tls-no-provider"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
http = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }
serde_json = "1.0.149"
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
