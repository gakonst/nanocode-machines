[package]
name = "nanocode-machines"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Machine Payments Protocol transports for Nanocode agents"
repository = "https://github.com/gakonst/nanocode-machines"
publish = false

[dependencies]
nanocode = { git = "https://github.com/gakonst/nanocode", rev = "e6ad17e1696488be519bf9916f5e7b0a5d7bc18c" }
mpp = { git = "https://github.com/tempoxyz/mpp-rs", rev = "53803eab2dd8965b394041fdff5f7849c7525744", default-features = false, features = ["client", "tempo", "sqlite", "reqwest-rustls-tls-no-provider"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
http = "1.3.1"
memchr = "2.8.3"
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.48.0", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
